<!DOCTYPE html>
<html>
<head>
    <title>Summary</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Spending Summary</h1>
    <p><a href="/">+ Add new expense</a> | <a href="/expenses">All expenses</a></p>

    <h2>Total spent: ₹{{ total }}</h2>

    {% if has_chart %}
    <div class="row">
        <div class="left">
            <table>
                <tr>
                    <th>Category</th>
                    <th>Amount (₹)</th>
                </tr>
                {% for cat, amt in rows %}
                <tr>
                    <td>{{ cat }}</td>
                    <td>{{ amt }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>
        <div class="right">
            <img src="/static/chart.png?v={{ v }}" alt="Spending chart">
        </div>
    </div>
    {% else %}
    <p>No expenses yet. Add some first.</p>
    {% endif %}
</body>
</html>
